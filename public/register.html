<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Node-RED MQTT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { surface: { dim: '#090d15' }, panel: '#111823', primary: '#ff7a18',
        border: { base: '#252d3a' }, text: { main: '#e6edf7', muted: '#8190a6' },
        telemetry: { error: '#ff5964' } },
      fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
    }}};
  </script>
  <link rel="stylesheet" href="/ui.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .auth-stage { position: relative; z-index: 1; display: grid; min-height: 100vh; place-items: center; padding: 60px 16px 20px; }
    .auth-panel { width: min(100%, 410px); padding: 18px; border: 1px solid var(--line); background: rgba(17,24,35,.97); box-shadow: 0 18px 50px #000; }
    .auth-bar { display: flex; align-items: center; gap: 9px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
    .auth-mark { display: grid; place-items: center; width: 31px; height: 31px; border: 1px solid var(--orange); color: var(--orange); font: 700 12px "JetBrains Mono",monospace; }
    .auth-kicker { color: var(--muted); font: 9px "JetBrains Mono",monospace; letter-spacing: .1em; }
    .auth-heading { margin: 18px 0 3px; font-size: 19px; }
    .auth-copy { margin: 0 0 18px; color: var(--muted); font-size: 11px; }
    .auth-field { display: grid; gap: 5px; margin-bottom: 12px; }
    .auth-field label { color: var(--muted); font: 9px "JetBrains Mono",monospace; letter-spacing: .08em; text-transform: uppercase; }
    .auth-field input { width: 100%; height: 34px; }
    .auth-submit { width: 100%; height: 35px; margin-top: 4px; }
    .auth-error { margin-bottom: 12px; padding: 8px; border: 1px solid rgba(255,89,100,.5); color: var(--red); background: rgba(255,89,100,.08); }
    .auth-or { display: flex; align-items: center; gap: 8px; margin: 16px 0; color: var(--muted); font: 9px "JetBrains Mono",monospace; text-transform: uppercase; }
    .auth-or::before, .auth-or::after { content: ""; height: 1px; flex: 1; background: var(--line); }
    .auth-foot { color: var(--muted); text-align: center; font-size: 11px; }
    .strength { height: 3px; margin-top: 6px; background: var(--line); }
    #strengthFill { height: 100%; transition: width .2s, background .2s; }
  </style>
</head>
<body>
  <nav><a href="/dashboard">Dashboard</a><a href="/login">Login</a></nav>
  <script src="/site-nav.js"></script>
  <main class="auth-stage">
    <section class="auth-panel">
      <header class="auth-bar"><span class="auth-mark">NR</span><div><strong>NODE-RED MQTT</strong><div class="auth-kicker">IDENTITY PROVISIONING // 02</div></div></header>
      <h1 class="auth-heading">Register</h1>
      <p class="auth-copy">Create an operator account.</p>
      <div id="errorBox" class="auth-error hidden"></div>
      <form id="regForm">
        <div class="auth-field"><label for="username">Username</label><input type="text" id="username" name="username" placeholder="operator" minlength="3" maxlength="32" required></div>
        <div class="auth-field"><label for="password">Password <span class="muted" style="float:right">MIN. 6 CHARS</span></label><input type="password" id="password" name="password" minlength="6" required><div class="strength"><div id="strengthFill" style="width:0"></div></div><div id="strengthText" class="muted"></div></div>
        <div class="auth-field"><label for="password2">Confirm Password</label><input type="password" id="password2" name="password2" required></div>
        <button type="submit" class="btn primary auth-submit" id="submitBtn">CREATE ACCOUNT</button>
      </form>
      <div class="auth-or">or</div>
      <p class="auth-foot">Already have an account? <a href="/login">Sign In</a></p>
    </section>
  </main>
  <script>
    const pwInput = document.getElementById('password');
    const pw2Input = document.getElementById('password2');
    const fill = document.getElementById('strengthFill');
    const fillText = document.getElementById('strengthText');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');
    const levels = [
      ['#ff5964', 'Very Weak'], ['#ffb347', 'Weak'], ['#ff7a18', 'Fair'],
      ['#38d996', 'Strong'], ['#20c8e8', 'Very Strong']
    ];
    pwInput.oninput = () => {
      const value = pwInput.value;
      let score = (value.length >= 6) + (value.length >= 10) + /[A-Z]/.test(value) + /[0-9]/.test(value) + /[^a-zA-Z0-9]/.test(value);
      score = Math.min(score, 4);
      fill.style.width = value ? (score + 1) * 20 + '%' : '0';
      fill.style.background = levels[score][0];
      fillText.textContent = value ? levels[score][1] : '';
    };
    pw2Input.oninput = () => pw2Input.style.borderColor = pw2Input.value !== pwInput.value ? 'var(--red)' : '';
    document.getElementById('regForm').onsubmit = async event => {
      event.preventDefault();
      errorBox.classList.add('hidden');
      if (pwInput.value !== pw2Input.value) { errorBox.textContent = 'Passwords do not match'; errorBox.classList.remove('hidden'); return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'REGISTERING...';
      try {
        const response = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: pwInput.value }) });
        const data = await response.json();
        if (data.error) { errorBox.textContent = data.error; errorBox.classList.remove('hidden'); submitBtn.disabled = false; submitBtn.textContent = 'CREATE ACCOUNT'; }
        else { submitBtn.textContent = 'DONE'; location.href = data.redirectTo || '/dashboard'; }
      } catch { errorBox.textContent = 'Server connection error'; errorBox.classList.remove('hidden'); submitBtn.disabled = false; submitBtn.textContent = 'CREATE ACCOUNT'; }
    };
  </script>
</body>
</html>
